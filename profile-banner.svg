<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Kunal Datta — Learn, Build, Grow</title>
  <desc id="desc">Forest green and cream GitHub profile banner with golden honeycomb cells and diamond geometry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#103c2b"/>
      <stop offset="0.55" stop-color="#1e583d"/>
      <stop offset="1" stop-color="#0c3124"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe98e"/>
      <stop offset="1" stop-color="#e0ad27"/>
    </linearGradient>
    <pattern id="hexes" width="84" height="73" patternUnits="userSpaceOnUse">
      <path d="M21 2 L42 14 L42 38 L21 50 L0 38 L0 14 Z" fill="none" stroke="#d7e5c1" stroke-width="1.4" opacity=".22"/>
      <path d="M63 39 L84 51 L84 75 L63 87 L42 75 L42 51 Z" fill="none" stroke="#efd15a" stroke-width="1.5" opacity=".26"/>
    </pattern>
  </defs>
  <rect width="1200" height="330" rx="22" fill="url(#bg)"/>
  <rect x="12" y="12" width="1176" height="306" rx="17" fill="none" stroke="#e6c84c" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="290" rx="12" fill="url(#hexes)"/>
  <!-- Honeycomb clusters -->
  <g transform="translate(38 70)" stroke="#f1cd50" stroke-width="2" fill="#c2d8a8" fill-opacity=".08">
    <polygon points="33,0 62,17 62,51 33,68 4,51 4,17"/>
    <polygon points="91,34 120,51 120,85 91,102 62,85 62,51"/>
    <polygon points="33,68 62,85 62,119 33,136 4,119 4,85"/>
    <polygon points="149,0 178,17 178,51 149,68 120,51 120,17" opacity=".56"/>
  </g>
  <!-- Diamond facets on right -->
  <g transform="translate(985 165)">
    <polygon points="0,-92 59,-42 0,85 -59,-42" fill="#f7f1df" fill-opacity=".07" stroke="#f3d65a" stroke-width="2.2"/>
    <polygon points="0,-92 25,-42 0,85 -25,-42" fill="#b5d19b" fill-opacity=".18" stroke="#dce8c7" stroke-width="1.4"/>
    <path d="M-59 -42 H59 M-25 -42 L0 -92 L25 -42 M-59 -42 L0 1 L59 -42 M0 1 V85" fill="none" stroke="#e8ca50" stroke-width="1.5" opacity=".9"/>
    <polygon points="95,-70 107,-49 95,-28 83,-49" fill="url(#gold)"/>
    <polygon points="-98,69 -85,91 -98,113 -111,91" fill="url(#gold)"/>
    <polygon points="83,91 95,112 83,133 71,112" fill="#c9dcb3"/>
  </g>
  <!-- Small diamond separator -->
  <g fill="url(#gold)"><polygon points="278,92 289,103 278,114 267,103"/><polygon points="279,226 287,234 279,242 271,234"/><polygon points="750,82 759,91 750,100 741,91"/><polygon points="791,241 800,250 791,259 782,250"/></g>
  <text x="275" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#e8d77a" letter-spacing="1.5">HELLO, I'M</text>
  <text x="273" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#fbf5e5">Kunal Datta</text>
  <text x="278" y="189" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="3.5" fill="#cde0b9">AI  ✦  DATA  ✦  BUILDING</text>
  <line x1="278" y1="209" x2="686" y2="209" stroke="#e6c84c" stroke-width="1.6" opacity=".8"/>
  <text x="278" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#fbf5e5">Turning ideas into practical,</text>
  <text x="278" y="273" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#fbf5e5">thoughtful technology.</text>
  <text x="63" y="286" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2" fill="#e4d99f">LEARN · BUILD · GROW</text>
  <text x="1030" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#dce8c7">curious by design</text>
</svg>
